<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About — Nanomind Explorer</title>
    <meta name="description" content="Tentang penulis di balik Nanomind Explorer — proyek, alat, dan cara menghubungi.">
    <meta name="theme-color" content="#14140F">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://raw.githubusercontent.com">
    <link rel="preconnect" href="https://api.github.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Source+Serif+4:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .about-hero { padding: 80px 24px 40px; text-align: center; }
        .avatar-ring { position: relative; padding: 4px; border-radius: 50%; background: linear-gradient(135deg, var(--brass), var(--rust)); display: inline-block; }
        .avatar-ring img { border-radius: 50%; display: block; width: 132px; height: 132px; object-fit: cover; }
    </style>
</head>
<body>
    <noscript><div style="padding:60px 24px;text-align:center;font-family:sans-serif;background:#14140F;color:#EDE8DA;">Situs ini membutuhkan JavaScript untuk menampilkan konten. Mohon aktifkan JavaScript di browser Anda.</div></noscript>

    <div id="pageLoader" aria-hidden="true">
        <svg class="loader-mark" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="38" fill="none" stroke="#C9974A" stroke-width="2.4"/>
            <polygon points="50,13 59,50 41,50" fill="#C9974A"/>
            <polygon points="50,87 59,50 41,50" fill="#5C5A48"/>
            <circle cx="50" cy="50" r="6.5" fill="#14140F" stroke="#C9974A" stroke-width="2.2"/>
        </svg>
    </div>

    <div id="navPlaceholder"></div>
    <div class="mobile-nav-backdrop" id="mobileNavBackdrop"></div>
    <div class="mobile-nav-panel" id="mobileNavPanel"></div>

    <main>
        <section class="about-hero">
            <div class="avatar-ring mb-6 reveal"><img id="aboutAvatar" src="https://via.placeholder.com/132" alt="Avatar"></div>
            <p class="eyebrow justify-center mb-4 reveal">The Explorer</p>
            <h1 class="font-display font-semibold text-4xl md:text-5xl mb-4 reveal" style="color:var(--parchment-text)" id="aboutName">Your Name</h1>
            <p class="font-ui max-w-xl mx-auto reveal" style="color:var(--muted-on-ink)" id="aboutBio">Bio</p>
            <div class="reveal mt-6">
                <button class="btn-ghost hidden admin-only" id="editProfileBtn"><i class="fas fa-pen"></i> Edit Profile</button>
            </div>
        </section>

        <section class="max-w-[1000px] mx-auto px-6 mt-16">
            <div class="flex items-center justify-between mb-8 reveal flex-wrap gap-4">
                <div>
                    <span class="eyebrow">The Workshop</span>
                    <h2 class="font-display font-semibold text-3xl mt-3" style="color:var(--parchment-text)">Projects & Builds</h2>
                </div>
                <button class="btn-primary hidden admin-only" id="addProjectBtn"><i class="fas fa-plus"></i> Add Project</button>
            </div>
            <div class="workshop-grid" id="projectsGrid"></div>
        </section>

        <section class="max-w-[1000px] mx-auto px-6 mt-20">
            <div class="flex items-center justify-between mb-8 reveal flex-wrap gap-4">
                <div>
                    <span class="eyebrow">Connect</span>
                    <h2 class="font-display font-semibold text-3xl mt-3" style="color:var(--parchment-text)">Links & Socials</h2>
                </div>
                <button class="btn-primary hidden admin-only" id="addLinkBtn"><i class="fas fa-plus"></i> Add Link</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="linksList"></div>
        </section>
    </main>

    <div id="footerPlaceholder"></div>

    <button class="search-fab" id="searchFab" title="Search (Ctrl+K)" aria-label="Buka pencarian"><i class="fas fa-search"></i></button>
    <button class="admin-fab hidden" id="adminFab" title="Admin"><i class="fas fa-compass-drafting"></i></button>
    <button class="back-to-top" id="backToTopBtn" title="Kembali ke atas" aria-label="Kembali ke atas"><i class="fas fa-arrow-up"></i></button>

    <div id="modalsPlaceholder"></div>

    <script src="script.js"></script>
</body>
</html>
