name: Sync X Articles

on:
  schedule:
    # Every 30 minutes — new X Articles must land in x-articles.json quickly;
    # the site polls this file and loads content via FixTweet.
    - cron: "5,35 * * * *"
  workflow_dispatch:
    inputs:
      deep:
        description: "Deep scan (more timeline pages + more FixTweet checks)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      extra_status_ids:
        description: "Optional comma-separated status IDs to force-include (e.g. brand-new article)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: sync-x-articles
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover & update x-articles.json
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          EXTRA_STATUS_IDS: ${{ github.event.inputs.extra_status_ids || '' }}
        run: |
          set -euo pipefail
          chmod +x tools/sync-x-articles.py
          DEEP_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.deep }}" = "true" ]; then
            DEEP_FLAG="--deep --pages 40"
          fi
          python3 tools/sync-x-articles.py $DEEP_FLAG

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add x-articles.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-sync X Articles statusIds ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
            echo "Pushed updated x-articles.json"
          fi
