name: Sync Instagram (POTD + Gallery)

on:
  schedule:
    # Every 2 hours — keep POTD close to the latest IG post + gallery fresh
    - cron: "12 */2 * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [sync-instagram-potd]

permissions:
  contents: write

concurrency:
  group: sync-instagram-potd
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Instagram posts → POTD + gallery
        run: |
          set -euo pipefail
          chmod +x tools/sync-instagram-potd.py
          # --max-posts 12: ambil 12 post terbaru untuk gallery
          python3 tools/sync-instagram-potd.py --username extensions.ig --max-posts 12

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # POTD files
          git add instagram-potd.json db.json 2>/dev/null || true
          git add -f media/potd-instagram.jpg 2>/dev/null || true
          git add -f media/potd-instagram.mp4 2>/dev/null || true
          # Gallery files
          git add instagram-posts.json 2>/dev/null || true
          git add -f media/ig-*.jpg 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-sync Instagram (POTD + gallery) ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
            echo "Pushed Instagram update"
          fi
