name: Merge MMPD dispatch
on:
  workflow_dispatch:
  push:
    paths:
      - tools/merge_mmpd.py
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore db.json and insert MMPD article
        run: python3 tools/merge_mmpd.py
      - name: Commit db.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Restore db.json and add MMPD dispatch (art-mmpd)"
          git push
