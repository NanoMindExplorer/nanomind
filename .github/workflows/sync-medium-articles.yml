name: Sync Medium Articles

on:
  schedule:
    # Every 2 hours (offset from the X Articles sync job)
    - cron: "35 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-medium-articles
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync medium-articles.json
        run: |
          set -euo pipefail
          chmod +x tools/sync-medium-articles.py
          python3 tools/sync-medium-articles.py --username 0wlsky

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medium-articles.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-sync Medium articles ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
            echo "Pushed updated medium-articles.json"
          fi
