<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch — Nanomind Explorer</title>
    <meta name="description" content="Kumpulan video dan shorts dari Nanomind Explorer — cuplikan lapangan dari proses build.">
    <meta name="theme-color" content="#14140F">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Watch — Nanomind Explorer">
    <meta property="og:description" content="Kumpulan video dan shorts dari Nanomind Explorer — cuplikan lapangan dari proses build.">
    <meta property="og:image" content="https://raw.githubusercontent.com/NanoMindExplorer/nanomind/main/bg-ghibli-poster.jpg">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://img.youtube.com">
    <link rel="preconnect" href="https://www.youtube.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preload" href="fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/fraunces-600.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="style.css?v=15">
</head>
<body>
    <a class="skip-link" href="#mainContent">Loncat ke konten</a>
    <div id="offlineBanner" class="offline-banner hidden" role="status">Anda offline — menampilkan cache lokal bila ada.</div>
    <noscript><div style="padding:60px 24px;text-align:center;font-family:sans-serif;background:#14140F;color:#EDE8DA;">Situs ini membutuhkan JavaScript untuk menampilkan konten. Mohon aktifkan JavaScript di browser Anda.</div></noscript>

    <div id="pageLoader" aria-hidden="true">
        <svg class="loader-mark" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="38" fill="none" stroke="#C9974A" stroke-width="2.4"/>
            <polygon points="50,13 59,50 41,50" fill="#C9974A"/>
            <polygon points="50,87 59,50 41,50" fill="#5C5A48"/>
            <circle cx="50" cy="50" r="6.5" fill="#14140F" stroke="#C9974A" stroke-width="2.2"/>
        </svg>
    </div>

    <div id="navPlaceholder"></div>
    <div class="mobile-nav-backdrop" id="mobileNavBackdrop"></div>
    <div class="mobile-nav-panel" id="mobileNavPanel"></div>

    <main id="mainContent" class="journal-main">
        <div class="journal-stack">
            <section class="section-surface reveal">
                <div class="section-surface-head flex-wrap gap-4">
                    <div>
                        <span class="eyebrow">Field Footage</span>
                        <h1 class="section-title section-title--lg">Watch</h1>
                        <p class="section-sub">Cuplikan video dan shorts dari proses build — di lapangan, bukan cuma di layar.</p>
                    </div>
                    <button class="btn-primary hidden admin-only" id="addVideoBtn"><i class="fas fa-video"></i> Add Video</button>
                </div>
                <div class="flex flex-wrap gap-2 mb-2" id="videoFilterTabs">
                    <button class="cat-pill active" data-vfilter="all">All</button>
                    <button class="cat-pill" data-vfilter="landscape">Landscape</button>
                    <button class="cat-pill" data-vfilter="shorts">Shorts</button>
                </div>
            </section>

            <section class="section-surface reveal hidden" id="shortsShelfWrap">
                <h2 class="font-display font-semibold text-xl mb-4 flex items-center gap-2" style="color:var(--parchment-text)"><i class="fas fa-bolt" style="color:var(--brass)"></i> Shorts</h2>
                <div class="shorts-shelf" id="shortsShelfGrid"></div>
            </section>

            <section class="section-surface">
                <div class="video-grid" id="videoGrid"></div>
                <p class="hidden text-center py-10 font-ui section-empty" id="videoEmpty">Belum ada video. Tambahkan lewat tombol admin di pojok kanan bawah.</p>
            </section>
        </div>
    </main>

    <div id="footerPlaceholder"></div>

    <button class="search-fab" id="searchFab" title="Search (Ctrl+K)" aria-label="Buka pencarian"><i class="fas fa-search"></i></button>
    <button class="admin-fab hidden" id="adminFab" title="Admin"><i class="fas fa-compass-drafting"></i></button>
    <button class="back-to-top" id="backToTopBtn" title="Kembali ke atas" aria-label="Kembali ke atas"><i class="fas fa-arrow-up"></i></button>

    <div id="modalsPlaceholder"></div>

    <script src="script.js?v=15"></script>
</body>
</html>
