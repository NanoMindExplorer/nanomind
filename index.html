<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nanomind Explorer — Dispatches from the Frontier</title>
    <meta name="description" content="Dispatches dari batas eksplorasi kode, ide, dan rasa penasaran — oleh Iman Firmansyah. Termasuk X Articles live dari @Deadmouse_jpeg.">
    <meta name="theme-color" content="#14140F">
    <link rel="canonical" href="https://nanomindexplorer.github.io/nanomind/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Nanomind Explorer">
    <meta property="og:title" content="Nanomind Explorer — Dispatches from the Frontier">
    <meta property="og:description" content="Dispatches dari batas eksplorasi kode, ide, dan rasa penasaran.">
    <meta property="og:image" content="https://raw.githubusercontent.com/NanoMindExplorer/nanomind/main/bg-ghibli-poster.jpg">
    <meta property="og:url" content="https://nanomindexplorer.github.io/nanomind/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Nanomind Explorer — Dispatches from the Frontier">
    <meta name="twitter:description" content="Dispatches dari batas eksplorasi kode, ide, dan rasa penasaran.">
    <meta name="twitter:image" content="https://raw.githubusercontent.com/NanoMindExplorer/nanomind/main/bg-ghibli-poster.jpg">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://raw.githubusercontent.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preload" href="fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/fraunces-600.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <noscript><div style="padding:60px 24px;text-align:center;font-family:sans-serif;background:#14140F;color:#EDE8DA;">Situs ini membutuhkan JavaScript untuk menampilkan konten. Mohon aktifkan JavaScript di browser Anda.</div></noscript>

    <div id="pageLoader" aria-hidden="true">
        <svg class="loader-mark" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="38" fill="none" stroke="#C9974A" stroke-width="2.4"/>
            <polygon points="50,13 59,50 41,50" fill="#C9974A"/>
            <polygon points="50,87 59,50 41,50" fill="#5C5A48"/>
            <circle cx="50" cy="50" r="6.5" fill="#14140F" stroke="#C9974A" stroke-width="2.2"/>
        </svg>
    </div>

    <div id="navPlaceholder"></div>
    <div class="mobile-nav-backdrop" id="mobileNavBackdrop"></div>
    <div class="mobile-nav-panel" id="mobileNavPanel"></div>

    <main class="journal-main">
        <!-- HERO / LEAD STORY -->
        <section id="heroFeature" class="hero-slot">
            <div class="skeleton-hero" id="heroSkeleton" aria-hidden="true">
                <div class="skeleton-block skeleton-hero-inner"></div>
            </div>
        </section>

        <!-- JOURNAL STACK: panels over landscape -->
        <div class="journal-stack">
            <!-- PHOTO OF THE DAY -->
            <section class="section-surface reveal" id="potdSectionWrap">
                <div id="potdSection">
                    <div class="skeleton-potd" id="potdSkeleton" aria-hidden="true">
                        <div class="skeleton-block skeleton-potd-img"></div>
                        <div class="skeleton-potd-text">
                            <div class="skeleton-line w-32"></div>
                            <div class="skeleton-line w-full"></div>
                            <div class="skeleton-line w-4/5"></div>
                            <div class="skeleton-line w-24"></div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- FROM X — live articles rail -->
            <section class="section-surface reveal" id="xArticlesSection">
                <div class="section-surface-head">
                    <div>
                        <span class="eyebrow">From X</span>
                        <h2 class="section-title">X Articles</h2>
                        <p class="section-sub">Long-form live dari <a href="https://x.com/Deadmouse_jpeg" target="_blank" rel="noopener noreferrer" class="text-brass">@Deadmouse_jpeg</a></p>
                    </div>
                </div>
                <div class="x-rail" id="xArticlesRail" aria-label="X Articles">
                    <div class="skeleton-x-rail" id="xRailSkeleton" aria-hidden="true">
                        <div class="skeleton-block skeleton-x-card"></div>
                        <div class="skeleton-block skeleton-x-card"></div>
                        <div class="skeleton-block skeleton-x-card"></div>
                        <div class="skeleton-block skeleton-x-card"></div>
                    </div>
                </div>
                <p class="hidden section-empty" id="xArticlesEmpty">Belum ada X Article yang bisa ditarik. Coba refresh nanti.</p>
            </section>

            <!-- DISPATCHES GRID (local journal) -->
            <section class="section-surface">
                <div class="section-surface-head flex-wrap gap-4">
                    <div>
                        <span class="eyebrow">Latest</span>
                        <h2 class="section-title">Dispatches</h2>
                        <p class="section-sub">Catatan dari meja kerja — build log, deep dive, dan field notes.</p>
                    </div>
                    <button class="btn-primary hidden admin-only" id="addArticleBtn"><i class="fas fa-feather-pointed"></i> New Dispatch</button>
                </div>
                <div class="flex flex-wrap gap-2 mb-8" id="categoryPills"></div>
                <div class="dispatch-grid" id="dispatchGrid">
                    <div class="skeleton-dispatch-grid" id="dispatchSkeleton" aria-hidden="true">
                        <div class="skeleton-block skeleton-card span-4"></div>
                        <div class="skeleton-block skeleton-card span-2"></div>
                        <div class="skeleton-block skeleton-card span-2"></div>
                        <div class="skeleton-block skeleton-card span-2"></div>
                        <div class="skeleton-block skeleton-card span-2"></div>
                        <div class="skeleton-block skeleton-card span-2"></div>
                    </div>
                </div>
                <p class="hidden text-center py-10 font-ui section-empty" id="dispatchEmpty">Belum ada dispatch di kategori ini.</p>
                <div class="flex justify-center mt-10">
                    <button class="btn-ghost hidden" id="dispatchLoadMoreBtn"><i class="fas fa-chevron-down"></i> Load More</button>
                </div>
            </section>
        </div>
    </main>

    <div id="footerPlaceholder"></div>

    <button class="search-fab" id="searchFab" title="Search (Ctrl+K)" aria-label="Buka pencarian"><i class="fas fa-search"></i></button>
    <button class="admin-fab hidden" id="adminFab" title="Admin"><i class="fas fa-compass-drafting"></i></button>
    <button class="back-to-top" id="backToTopBtn" title="Kembali ke atas" aria-label="Kembali ke atas"><i class="fas fa-arrow-up"></i></button>

    <div id="modalsPlaceholder"></div>

    <script src="script.js"></script>
</body>
</html>
