<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nanomind Explorer — Dispatches from the Frontier</title>
    <meta name="description" content="Dispatches dari batas eksplorasi kode, ide, dan rasa penasaran — oleh Iman Firmansyah.">
    <meta name="theme-color" content="#14140F">
    <link rel="canonical" href="https://nanomindexplorer.github.io/nanomind/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Nanomind Explorer — Dispatches from the Frontier">
    <meta property="og:description" content="Dispatches dari batas eksplorasi kode, ide, dan rasa penasaran.">
    <meta property="og:image" content="https://raw.githubusercontent.com/NanoMindExplorer/nanomind/main/tunnelterminal.jpg">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://raw.githubusercontent.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Source+Serif+4:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <noscript><div style="padding:60px 24px;text-align:center;font-family:sans-serif;background:#14140F;color:#EDE8DA;">Situs ini membutuhkan JavaScript untuk menampilkan konten. Mohon aktifkan JavaScript di browser Anda.</div></noscript>

    <div id="pageLoader" aria-hidden="true">
        <svg class="loader-mark" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="38" fill="none" stroke="#C9974A" stroke-width="2.4"/>
            <polygon points="50,13 59,50 41,50" fill="#C9974A"/>
            <polygon points="50,87 59,50 41,50" fill="#5C5A48"/>
            <circle cx="50" cy="50" r="6.5" fill="#14140F" stroke="#C9974A" stroke-width="2.2"/>
        </svg>
    </div>

    <div id="navPlaceholder"></div>
    <div class="mobile-nav-backdrop" id="mobileNavBackdrop"></div>
    <div class="mobile-nav-panel" id="mobileNavPanel"></div>

    <main>
        <!-- HERO / LEAD STORY -->
        <section id="heroFeature"></section>

        <!-- PHOTO OF THE DAY -->
        <section class="max-w-[1200px] mx-auto px-6 mt-20 reveal" id="potdSection"></section>

        <!-- CATEGORY FILTER + DISPATCHES GRID -->
        <section class="max-w-[1200px] mx-auto px-6 mt-24">
            <div class="flex items-center justify-between mb-8 reveal flex-wrap gap-4">
                <div>
                    <span class="eyebrow">Latest</span>
                    <h2 class="font-display font-semibold text-3xl md:text-4xl mt-3" style="color:var(--parchment-text)">Dispatches</h2>
                </div>
                <button class="btn-primary hidden admin-only" id="addArticleBtn"><i class="fas fa-feather-pointed"></i> New Dispatch</button>
            </div>
            <div class="flex flex-wrap gap-2 mb-10 reveal" id="categoryPills"></div>
            <div class="dispatch-grid" id="dispatchGrid"></div>
            <p class="hidden text-center py-10 font-ui" style="color:var(--muted-on-ink)" id="dispatchEmpty">Belum ada dispatch di kategori ini.</p>
            <div class="flex justify-center mt-12">
                <button class="btn-ghost hidden" id="dispatchLoadMoreBtn"><i class="fas fa-chevron-down"></i> Load More</button>
            </div>
        </section>
    </main>

    <div id="footerPlaceholder"></div>

    <button class="search-fab" id="searchFab" title="Search (Ctrl+K)" aria-label="Buka pencarian"><i class="fas fa-search"></i></button>
    <button class="admin-fab hidden" id="adminFab" title="Admin"><i class="fas fa-compass-drafting"></i></button>
    <button class="back-to-top" id="backToTopBtn" title="Kembali ke atas" aria-label="Kembali ke atas"><i class="fas fa-arrow-up"></i></button>

    <div id="modalsPlaceholder"></div>

    <script src="script.js"></script>
</body>
</html>
